<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Meteor Defense</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,10,0.88);backdrop-filter:blur(10px);gap:16px;text-align:center;padding:24px;font-family:'Exo 2',sans-serif}
.overlay.hidden{display:none}
.title{font-family:'Orbitron',sans-serif;font-size:clamp(2rem,10vw,3.5rem);font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#00eeff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
.sub{font-size:clamp(0.8rem,3.5vw,1rem);color:#a0c4ff;max-width:320px;line-height:1.6;font-weight:600}
.stat{font-family:'Orbitron',sans-serif;font-size:clamp(1.4rem,7vw,2.5rem);color:#ffd700;text-shadow:0 0 20px #ffd700}
.btn{padding:14px 44px;border-radius:50px;border:2px solid #00eeff;background:linear-gradient(135deg,rgba(0,238,255,0.15),rgba(168,85,247,0.15));color:#00eeff;font-family:'Orbitron',sans-serif;font-size:1.1rem;letter-spacing:2px;cursor:pointer;box-shadow:0 0 24px rgba(0,238,255,0.3);transition:all .15s}
.btn:hover{background:linear-gradient(135deg,rgba(0,238,255,0.3),rgba(168,85,247,0.3));box-shadow:0 0 40px rgba(0,238,255,0.5)}
.btn:active{transform:scale(0.96)}
.record{font-size:0.85rem;color:#6b7280;margin-top:4px}
#ui{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:10;padding:10px 16px 0;display:flex;justify-content:space-between;align-items:flex-start;font-family:'Orbitron',sans-serif}
.hud-label{font-size:10px;font-weight:700;letter-spacing:2px;color:rgba(160,196,255,0.7);font-family:'Exo 2',sans-serif;text-transform:uppercase}
.hud-val{font-size:clamp(1.2rem,5vw,1.8rem);font-weight:700;color:#fff;text-shadow:0 0 12px rgba(0,238,255,0.6);font-variant-numeric:tabular-nums lining-nums;line-height:1}
#lives-row{display:flex;gap:4px;font-size:1.3rem}
#atmo-wrap{position:fixed;bottom:0;left:0;width:100%;z-index:10;padding:8px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#charge-track{width:min(260px,70vw);height:5px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden}
#charge-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff6600,#ffdd00);border-radius:4px;transition:width .2s}
#atmo-btn{pointer-events:auto;padding:9px 28px;border-radius:50px;border:2px solid #ff6600;background:rgba(255,80,0,0.12);color:#ff9933;font-family:'Orbitron',sans-serif;font-size:0.8rem;letter-spacing:1px;cursor:pointer;transition:all .2s;white-space:nowrap}
#atmo-btn.ready{border-color:#ff3300;background:rgba(255,50,0,0.3);color:#ff5500;box-shadow:0 0 20px rgba(255,80,0,0.6);animation:pulse-btn .7s infinite alternate}
#atmo-btn.active{border-color:#ffaa00;background:rgba(255,150,0,0.35);color:#ffdd00;box-shadow:0 0 30px rgba(255,150,0,0.7)}
#atmo-btn:disabled{opacity:0.3;cursor:default;animation:none}
#wave-banner{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:15;font-family:'Orbitron',sans-serif;font-size:clamp(1.5rem,8vw,2.8rem);font-weight:900;letter-spacing:3px;color:#00eeff;text-shadow:0 0 30px #00eeff;text-align:center;pointer-events:none;opacity:0;transition:opacity 0.3s}
@keyframes pulse-btn{from{box-shadow:0 0 12px rgba(255,80,0,0.4)}to{box-shadow:0 0 30px rgba(255,80,0,0.9)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div><div class="hud-label">Очки</div><div class="hud-val" id="hud-score">0</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
    <div id="lives-row"><span id="h1">❤️</span><span id="h2">❤️</span><span id="h3">❤️</span></div>
  </div>
  <div style="text-align:right"><div class="hud-label">Волна</div><div class="hud-val" id="hud-wave">1</div></div>
</div>

<div id="atmo-wrap">
  <div id="charge-track"><div id="charge-fill"></div></div>
  <button id="atmo-btn" disabled>🔥 АТМОСФЕРА (0%)</button>
</div>

<div id="wave-banner"></div>

<div class="overlay" id="ov-start">
  <div class="title">METEOR<br>DEFENSE</div>
  <div class="sub">Уничтожай кометы до того как они достигнут Земли.<br>Тап по комете или по пустому месту — стреляй!</div>
  <button class="btn" id="btn-start">НАЧАТЬ</button>
</div>
<div class="overlay hidden" id="ov-end">
  <div class="title">КОНЕЦ</div>
  <div class="sub">Земля не выдержала!</div>
  <div class="stat" id="end-score">0</div>
  <div class="record" id="end-record"></div>
  <button class="btn" id="btn-restart">СНОВА</button>
</div>

// ── Canvas ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, GROUND_Y = 0, PLAY_H = 0;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const aspect = 9/16;
  if (vw/vh < aspect) { W = vw; H = Math.floor(vw/aspect); }
  else { H = vh; W = Math.floor(vh*aspect); }
  canvas.width = W; canvas.height = H;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  GROUND_Y = Math.floor(H * 0.88); // земля начинается здесь
  PLAY_H   = GROUND_Y;             // кометы летят от 0 до GROUND_Y
}
resize();
window.addEventListener('resize', () => { resize(); });

// ── Images ───────────────────────────────────────────────────────────────
const bgSpace = new Image(); bgSpace.src = 'data:image/jpeg;base64,'+SPACE_B64;
const bgFire  = new Image(); bgFire.src  = 'data:image/jpeg;base64,'+FIRE_B64;

// ── Game state ────────────────────────────────────────────────────────────
let score=0, bestScore=0, lives=3, wave=1, running=false;
let meteors=[], particles=[], missiles=[], floats=[];
let charge=0, atmoActive=false, atmoCooldown=false, atmoTimer=0;
const MAX_CHARGE=100, ATMO_DUR=3000;
let waveSpawning=false, waveCount=0, waveTarget=0, spawnIv=null;
let fireAlpha=0, rafId=null;

// ── Audio ────────────────────────────────────────────────────────────────
let actx;
function initAudio(){ if(!actx) actx=new AudioContext(); }
function sfxBoom(big){
  if(!actx) return;
  const b=actx.createBuffer(1,actx.sampleRate*0.35,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,big?1.2:2.2);
  const s=actx.createBufferSource(),g=actx.createGain(),f=actx.createBiquadFilter();
  f.type='lowpass'; f.frequency.value=big?400:800;
  s.buffer=b; g.gain.value=big?.6:.35;
  s.connect(f).connect(g).connect(actx.destination); s.start();
}
function sfxShoot(){
  if(!actx) return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(900,actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(180,actx.currentTime+0.13);
  g.gain.setValueAtTime(.12,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+0.13);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+0.13);
}

// ── Spawn ─────────────────────────────────────────────────────────────────
function spawnMeteor(){
  const r = 14 + Math.random()*16 + Math.min(wave,8)*1.2;
  const speed = (0.9 + Math.random()*0.7 + wave*0.07) * (H/700);
  const hp = 1 + Math.floor(wave/3);
  meteors.push({
    x: r + Math.random()*(W-r*2),
    y: -r-10,
    r, speed,
    vx: (Math.random()-0.5)*0.6,
    hp, maxHp: hp,
    rot: Math.random()*Math.PI*2,
    rotSpd: (Math.random()-0.5)*0.05,
    col: ['#c08040','#8a6040','#b09060'][Math.floor(Math.random()*3)],
    trail: []
  });
}

// ── Particles ─────────────────────────────────────────────────────────────
function boom(x,y,big){
  const n=big?45:18;
  const cols=big?['#ff6600','#ff3300','#ffaa00','#fff','#ff9944']:['#ff8844','#ffaa55','#fff','#ff5500'];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(big?2:1)+Math.random()*(big?6:3);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:(big?3:1.5)+Math.random()*(big?6:3),alpha:1,col:cols[Math.floor(Math.random()*cols.length)],decay:.018+Math.random()*.025});
  }
  sfxBoom(big);
}
function hitFx(x,y){
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2;
    particles.push({x,y,vx:Math.cos(a)*(1+Math.random()*2),vy:Math.sin(a)*(1+Math.random()*2),r:1+Math.random()*2,alpha:1,col:'#fff',decay:.07+Math.random()*.06});
  }
}
function addFloat(x,y,txt,col='#ffd700'){
  floats.push({x,y,txt,col,alpha:1,vy:-1.5});
}

// ── Missile ────────────────────────────────────────────────────────────────
function fireMissile(tx,ty){
  missiles.push({x:W/2, y:GROUND_Y-10, tx, ty, spd:12*(H/700), trail:[]});
  sfxShoot();
}

// ── HUD ────────────────────────────────────────────────────────────────────
function updateHUD(){
  document.getElementById('hud-score').textContent=score.toLocaleString('ru-RU');
  document.getElementById('hud-wave').textContent=wave;
  ['h1','h2','h3'].forEach((id,i)=>{ document.getElementById(id).textContent=i<lives?'❤️':'🖤'; });
  document.getElementById('charge-fill').style.width=Math.min(charge,100)+'%';
  const btn=document.getElementById('atmo-btn');
  if(atmoActive){btn.className='active';btn.disabled=true;btn.textContent='🔥 АТМОСФЕРА ГОРИТ!';}
  else if(charge>=MAX_CHARGE&&!atmoCooldown){btn.className='ready';btn.disabled=false;btn.textContent='🔥 АКТИВИРОВАТЬ!';}
  else{btn.className='';btn.disabled=true;btn.textContent='🔥 АТМОСФЕРА ('+Math.floor(charge)+'%)';}
}

// ── Wave ───────────────────────────────────────────────────────────────────
function startWave(){
  waveTarget=4+wave*2; waveCount=0; waveSpawning=true;
  showBanner('ВОЛНА '+wave);
  const delay=Math.max(350,1100-wave*55);
  spawnIv=setInterval(()=>{
    if(!running||!waveSpawning) return;
    spawnMeteor(); waveCount++;
    if(waveCount>=waveTarget){clearInterval(spawnIv);waveSpawning=false;}
  },delay);
}

function showBanner(txt){
  const el=document.getElementById('wave-banner');
  el.textContent=txt; el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',1400);
}

function checkWaveDone(){
  if(!waveSpawning&&meteors.length===0&&running){
    wave++;
    charge=Math.min(charge+15,MAX_CHARGE);
    updateHUD();
    setTimeout(startWave,1400);
  }
}

// ── Earth hit ──────────────────────────────────────────────────────────────
function earthHit(){
  lives--;
  updateHUD();
  boom(W/2+Math.random()*80-40, GROUND_Y+10, true);
  if(lives<=0) setTimeout(endGame,500);
}

// ── DRAW ───────────────────────────────────────────────────────────────────
function drawBg(){
  // Space / fire background — always draw fallback first
  const grd=ctx.createLinearGradient(0,0,0,GROUND_Y);
  grd.addColorStop(0,'#02020e'); grd.addColorStop(1,'#050520');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,GROUND_Y);

  if(bgSpace.complete&&bgSpace.naturalWidth>0){
    const srcH=Math.floor(bgSpace.naturalHeight*0.88);
    ctx.drawImage(bgSpace,0,0,bgSpace.naturalWidth,srcH,0,0,W,GROUND_Y);
  }
  if(fireAlpha>0&&bgFire.complete&&bgFire.naturalWidth>0){
    ctx.globalAlpha=fireAlpha;
    ctx.drawImage(bgFire,0,0,bgFire.naturalWidth,bgFire.naturalHeight,0,0,W,GROUND_Y);
    ctx.globalAlpha=1;
  }

  // ── Earth strip at bottom ──────────────────────────────────────────
  // Dark sky-to-ground gradient in bottom strip
  const stripH = H - GROUND_Y;
  // Earth surface gradient
  const eg = ctx.createLinearGradient(0,GROUND_Y,0,H);
  eg.addColorStop(0,'#0a2a10');
  eg.addColorStop(0.4,'#0e3a1a');
  eg.addColorStop(1,'#050f08');
  ctx.fillStyle=eg; ctx.fillRect(0,GROUND_Y,W,stripH);

  // Horizon curve (subtle)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0,GROUND_Y+2);
  ctx.quadraticCurveTo(W/2, GROUND_Y-8, W, GROUND_Y+2);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
  const hg=ctx.createLinearGradient(0,GROUND_Y,0,H);
  hg.addColorStop(0,'#1a5a28'); hg.addColorStop(0.3,'#0e3a18'); hg.addColorStop(1,'#040d06');
  ctx.fillStyle=hg; ctx.fill();
  ctx.restore();

  // Atmosphere glow
  const ag=ctx.createLinearGradient(0,GROUND_Y-20,0,GROUND_Y+12);
  ag.addColorStop(0,'rgba(0,0,0,0)');
  ag.addColorStop(0.45,atmoActive?'rgba(255,110,0,0.65)':'rgba(30,150,255,0.5)');
  ag.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ag; ctx.fillRect(0,GROUND_Y-20,W,32);
}

function drawLauncher(){
  const lx=W/2, ly=GROUND_Y-4;
  ctx.save(); ctx.translate(lx,ly);
  ctx.shadowColor='#00eeff'; ctx.shadowBlur=16;
  ctx.fillStyle='#0e2240'; ctx.strokeStyle='#00eeff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(-20,-12,40,22,5); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#00eeff';
  ctx.fillRect(-5,-26,10,18);
  ctx.beginPath(); ctx.arc(0,-28,4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
}

function drawMeteors(){
  for(const m of meteors){
    ctx.save(); ctx.translate(m.x,m.y); ctx.rotate(m.rot);
    // Fire tail
    for(let i=0;i<m.trail.length;i++){
      const t=m.trail[i];
      const a=(i/m.trail.length)*0.55;
      const r=m.r*(1-i/m.trail.length)*0.7;
      ctx.beginPath(); ctx.arc(-t.dx*i*0.7,-t.dy*i*0.7,Math.max(r,1),0,Math.PI*2);
      ctx.fillStyle=`rgba(255,${80+i*12},0,${a})`; ctx.fill();
    }
    // Rock
    ctx.beginPath();
    for(let i=0;i<9;i++){
      const a=(i/9)*Math.PI*2;
      const rr=m.r*(0.7+Math.sin(i*2.7+m.rot*0.5)*0.3);
      i===0?ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    ctx.closePath();
    const rg=ctx.createRadialGradient(-m.r*.3,-m.r*.3,m.r*.08,0,0,m.r);
    rg.addColorStop(0,'#e8d0a0'); rg.addColorStop(0.5,m.col); rg.addColorStop(1,'#301a08');
    ctx.fillStyle=rg; ctx.fill();
    ctx.shadowColor='#ff8800'; ctx.shadowBlur=14;
    ctx.strokeStyle='rgba(255,140,0,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
    // HP bar
    if(m.maxHp>1){
      const bx=-m.r, by=m.r+5, bw=m.r*2;
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx,by,bw,4);
      ctx.fillStyle=`hsl(${(m.hp/m.maxHp)*120},100%,50%)`;
      ctx.fillRect(bx,by,(m.hp/m.maxHp)*bw,4);
    }
    ctx.restore();
  }
}

function drawMissiles(){
  for(const ms of missiles){
    for(let i=0;i<ms.trail.length;i++){
      const t=ms.trail[i];
      ctx.beginPath(); ctx.arc(t.x,t.y,2.5*(i/ms.trail.length),0,Math.PI*2);
      ctx.fillStyle=`rgba(0,220,255,${(i/ms.trail.length)*0.6})`; ctx.fill();
    }
    ctx.save(); ctx.translate(ms.x,ms.y);
    const ang=Math.atan2(ms.ty-ms.y,ms.tx-ms.x); ctx.rotate(ang);
    ctx.shadowColor='#00eeff'; ctx.shadowBlur=8;
    ctx.fillStyle='#00eeff'; ctx.fillRect(-10,-2.5,14,5);
    ctx.fillStyle='#fff'; ctx.fillRect(4,-2,4,4);
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=p.alpha;
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(p.r*p.alpha,0.5),0,Math.PI*2);
    ctx.fillStyle=p.col; ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawFloats(){
  ctx.textAlign='center';
  for(const f of floats){
    ctx.globalAlpha=f.alpha;
    ctx.fillStyle=f.col; ctx.shadowColor=f.col; ctx.shadowBlur=8;
    ctx.font=`bold ${Math.floor(W*0.055)}px Orbitron,sans-serif`;
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.textAlign='left';
}

// ── UPDATE ────────────────────────────────────────────────────────────────
function update(){
  // Meteors
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    m.trail.unshift({dx:m.vx,dy:m.speed});
    if(m.trail.length>7) m.trail.pop();
    m.y+=m.speed; m.x+=m.vx; m.rot+=m.rotSpd;
    m.x=Math.max(m.r,Math.min(W-m.r,m.x));
    // Atmo burn
    if(atmoActive&&m.y>GROUND_Y*0.65){
      boom(m.x,m.y,false);
      addFloat(m.x,m.y-20,'💥 СГОРЕЛ','#ff9900');
      score+=5*wave; charge=Math.min(charge+2,MAX_CHARGE);
      meteors.splice(i,1); updateHUD(); continue;
    }
    // Hit ground
    if(m.y>=GROUND_Y){
      boom(m.x,GROUND_Y,true);
      meteors.splice(i,1);
      earthHit();
    }
  }

  // Missiles
  for(let i=missiles.length-1;i>=0;i--){
    const ms=missiles[i];
    ms.trail.push({x:ms.x,y:ms.y});
    if(ms.trail.length>14) ms.trail.shift();
    const dx=ms.tx-ms.x, dy=ms.ty-ms.y, dist=Math.hypot(dx,dy);
    if(dist<ms.spd+4){
      // check meteor hits near target
      let hit=false;
      for(let j=meteors.length-1;j>=0;j--){
        const me=meteors[j];
        if(Math.hypot(me.x-ms.tx,me.y-ms.ty)<me.r*2){
          me.hp--; hitFx(me.x,me.y);
          if(me.hp<=0){
            boom(me.x,me.y,me.r>22);
            addFloat(me.x,me.y-20,'+'+(10+wave*2)*me.maxHp,'#ffd700');
            score+=(10+wave*2)*me.maxHp; charge=Math.min(charge+8,MAX_CHARGE);
            meteors.splice(j,1);
          }
          hit=true; break;
        }
      }
      if(!hit){ boom(ms.tx,ms.ty,false); }
      missiles.splice(i,1); updateHUD(); continue;
    }
    ms.x+=(dx/dist)*ms.spd; ms.y+=(dy/dist)*ms.spd;
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.alpha-=p.decay;
    if(p.alpha<=0) particles.splice(i,1);
  }

  // Floats
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];
    f.y+=f.vy; f.alpha-=0.02;
    if(f.alpha<=0) floats.splice(i,1);
  }

  // Atmo
  if(atmoActive){
    atmoTimer-=16.67;
    fireAlpha=Math.min(1,fireAlpha+0.05);
    if(atmoTimer<=0){
      atmoActive=false; atmoCooldown=true; charge=0;
      setTimeout(()=>{atmoCooldown=false;updateHUD();},5000);
    }
  } else {
    fireAlpha=Math.max(0,fireAlpha-0.03);
  }
  checkWaveDone();
}

// ── LOOP ──────────────────────────────────────────────────────────────────
function loop(){
  if(!running){rafId=null;return;}
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawLauncher();
  drawMissiles();
  drawMeteors();
  drawParticles();
  drawFloats();
  update();
  rafId=requestAnimationFrame(loop);
}

// ── INPUT ─────────────────────────────────────────────────────────────────
function getPos(e){
  const r=canvas.getBoundingClientRect();
  const sx=W/r.width, sy=H/r.height;
  const src=e.touches?e.touches[0]:e;
  return {x:(src.clientX-r.left)*sx, y:(src.clientY-r.top)*sy};
}

function handleTap(e){
  if(!running) return;
  e.preventDefault();
  initAudio();
  const {x,y}=getPos(e);
  if(y>GROUND_Y) return; // tap on earth — ignore
  // Direct meteor tap
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    if(Math.hypot(m.x-x,m.y-y)<m.r*1.5){
      m.hp--; hitFx(m.x,m.y);
      if(m.hp<=0){
        boom(m.x,m.y,m.r>22);
        addFloat(m.x,m.y-20,'+'+(10+wave*2)*m.maxHp,'#ffd700');
        score+=(10+wave*2)*m.maxHp; charge=Math.min(charge+8,MAX_CHARGE);
        meteors.splice(i,1);
      }
      updateHUD(); return;
    }
  }
  fireMissile(x,y);
}

canvas.addEventListener('mousedown', handleTap);
canvas.addEventListener('touchstart', handleTap, {passive:false});

document.getElementById('atmo-btn').addEventListener('click', ()=>{
  if(charge>=MAX_CHARGE&&!atmoCooldown&&!atmoActive&&running){
    initAudio();
    atmoActive=true; atmoTimer=ATMO_DUR;
    updateHUD();
  }
});

// ── GAME FLOW ─────────────────────────────────────────────────────────────
function startGame(){
  score=0; lives=3; wave=1; charge=0;
  meteors=[]; particles=[]; missiles=[]; floats=[];
  atmoActive=false; atmoCooldown=false; fireAlpha=0;
  running=true;
  document.getElementById('ov-start').classList.add('hidden');
  document.getElementById('ov-end').classList.add('hidden');
  updateHUD();
  if(rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
  startWave();
}

function endGame(){
  running=false; clearInterval(spawnIv);
  const rec=score>bestScore; if(rec) bestScore=score;
  document.getElementById('end-score').textContent=score.toLocaleString('ru-RU');
  document.getElementById('end-record').textContent=rec?'🏆 НОВЫЙ РЕКОРД!':'Рекорд: '+bestScore.toLocaleString('ru-RU');
  document.getElementById('ov-end').classList.remove('hidden');
}

document.getElementById('btn-start').addEventListener('click',()=>{initAudio();startGame();});
document.getElementById('btn-restart').addEventListener('click',()=>{initAudio();startGame();});

// idle bg render
(function idleLoop(){
  if(running) return;
  ctx.clearRect(0,0,W,H); drawBg(); drawLauncher();
  requestAnimationFrame(idleLoop);
})();
</script>
